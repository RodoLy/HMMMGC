# Dolphin settings for Harvest Moon: Magical Melody (USA), G4AEE9.
# Ajustes de Dolphin para Harvest Moon: Magical Melody (USA), G4AEE9.
#
# The Windows package adds this file after Dolphin's own settings for the game
# (Sys/GameSettings/G4AEE9.ini), and scripts/build_and_run_linux.sh copies it to the user folder
# (GameSettings/G4AEE9.ini), so the game starts with these settings without anyone editing a file.
# To change one only for yourself, write the same line in GameSettings/G4AEE9.ini inside your
# user folder: Dolphin gives that file priority over the package's.
# docs/PERFORMANCE.md explains why each setting is here and what it gained.
#
# El paquete de Windows agrega este archivo después de los ajustes que Dolphin ya trae para el
# juego (Sys/GameSettings/G4AEE9.ini), y scripts/build_and_run_linux.sh lo copia a la carpeta del
# usuario (GameSettings/G4AEE9.ini), así que el juego arranca con estos ajustes sin que nadie edite
# un archivo. Para cambiar uno solo para ti, escribe la misma línea en GameSettings/G4AEE9.ini
# dentro de tu carpeta de usuario: Dolphin le da prioridad a ese archivo sobre el del paquete.
# docs/PERFORMANCE.md explica por qué está cada ajuste y cuánto ganó.

[Core]
# The loop of the operating system's idle thread, `while (RunQueueBits == 0)`, found with
# tools/find_idle_loops.py. The runner skips it instead of executing every turn, so the game keeps
# its 30 frames per second with about half of the processor in quiet scenes.
# El bucle del hilo ocioso del sistema operativo, `while (RunQueueBits == 0)`, encontrado con
# tools/find_idle_loops.py. El runner lo salta en vez de ejecutar cada vuelta, así que el juego
# mantiene sus 30 cuadros por segundo con cerca de la mitad del procesador en escenas tranquilas.
StaticRecompIdlePC = 0x80174D98

# Do not emulate the slow drive of the console: a disc read takes the time of a buffered one, so the
# game starts sooner and the loads between zones are shorter. Set it to False for the original delays.
# No emular la lectura lenta del lector de la consola: leer del disco tarda lo que una lectura en
# búfer, así que el juego arranca antes y las cargas entre zonas son más cortas. Ponlo en False para
# tener las esperas originales.
FastDiscSpeed = True
