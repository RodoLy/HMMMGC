name: Instruction conformance

# Runs the instruction-level test of docs/VALIDATION.md without the game (--synthetic): the
# recompiled C code and Dolphin's interpreter execute made-up instruction words side by side on
# the same processor, and the lockstep verifier reports every result that differs. It runs on
# x86-64 and on ARM64 with Linux and GCC, and on Windows ARM64 twice: with MSVC, and with the
# portable compiler (llvm-mingw) that the Windows package ships. Windows ARM64 is the system and
# the processor of the laptops this project is meant for. No game data is involved.
#
# It builds ModernGekko first (20 to 40 minutes), so it only runs when asked for:
# Actions tab > Instruction conformance > Run workflow.

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: Seeds of the test programs, separated by spaces
        default: "1 2"
      words_per_form:
        description: Words tried for each instruction form
        default: "24"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    name: ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { architecture: x86-64, runner: ubuntu-24.04 }
          - { architecture: ARM64, runner: ubuntu-24.04-arm }
    env:
      TEMPLATE_URL: https://github.com/ExpansionPak/ModernGekko-Template.git
      TEMPLATE_DIRECTORY: ${{ github.workspace }}/ModernGekko-Template
      # Through the environment and not spliced into the commands, so that the text typed into
      # the form cannot become part of a command.
      SEEDS: ${{ inputs.seeds }}
      WORDS_PER_FORM: ${{ inputs.words_per_form }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the packages ModernGekko needs
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential pkg-config cmake \
            libevdev-dev libudev-dev libgtk-3-dev libsystemd-dev libbluetooth-dev \
            libasound2-dev libpulse-dev libgl1-mesa-dev libxrandr-dev libxi-dev xvfb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Download ModernGekko-Template at the commit the project is pinned to
        run: |
          # The same commit as scripts/build_and_run_linux.sh, so every platform builds the same code.
          template_commit=$(sed -n 's/^readonly TEMPLATE_COMMIT="\([0-9a-f]\{40\}\)"$/\1/p' scripts/build_and_run_linux.sh)
          [[ -n "$template_commit" ]] || { echo "TEMPLATE_COMMIT not found in the Linux script" >&2; exit 1; }
          echo "ModernGekko-Template commit: $template_commit"
          git clone --no-checkout "$TEMPLATE_URL" "$TEMPLATE_DIRECTORY"
          git -C "$TEMPLATE_DIRECTORY" checkout --quiet "$template_commit"
          git -C "$TEMPLATE_DIRECTORY" submodule sync --recursive --quiet
          # The submodules only the Windows and Android builds use (Qt, FFmpeg-bin, libadrenotools)
          # are skipped, as in the Linux script. HTTP/1.1 because HTTP/2 often cuts big fetches.
          for attempt in 1 2 3; do
            git -C "$TEMPLATE_DIRECTORY" -c http.version=HTTP/1.1 \
              -c submodule.Externals/Qt.update=none \
              -c submodule.Externals/FFmpeg-bin.update=none \
              -c submodule.Externals/libadrenotools.update=none \
              submodule update --init --recursive --force --jobs 4 && break
            echo "download attempt $attempt failed" >&2
            [[ "$attempt" -lt 3 ]] || exit 1
          done

      - name: Apply the lockstep verifier patch
        run: |
          git -C "$TEMPLATE_DIRECTORY/lib/ModernGekko/vendor/dolphin" \
            apply "$GITHUB_WORKSPACE/patches/moderngekko/lockstep-verifier.patch"

      - name: Build DolRecomp and ModernGekko
        run: make -C "$TEMPLATE_DIRECTORY" tools

      - name: Run the instruction-level test
        run: |
          read -ra seeds <<< "$SEEDS"
          python tools/run_isa_conformance.py --synthetic \
            --template "$TEMPLATE_DIRECTORY" \
            --work-directory "$RUNNER_TEMP/isa_conformance" \
            --toolchain gcc \
            --seeds "${seeds[@]}" \
            --words-per-form "$WORDS_PER_FORM"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/isa_conformance/seed_*/report.txt
            ${{ runner.temp }}/isa_conformance/seed_*/cases.tsv
          if-no-files-found: warn

  windows-arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      TEMPLATE_URL: https://github.com/ExpansionPak/ModernGekko-Template.git
      # Short paths on purpose: the files of the recompiled module sit in a folder named after the
      # hash of the program, and Windows programs stop at 260 characters by default.
      TEMPLATE_DIRECTORY: C:/mg
      WORK_DIRECTORY: C:/w
      PORTABLE_WORK_DIRECTORY: C:/w-clang
      PYTHONUTF8: "1"
      # Through the environment and not spliced into the commands, so that the text typed into
      # the form cannot become part of a command.
      SEEDS: ${{ inputs.seeds }}
      WORDS_PER_FORM: ${{ inputs.words_per_form }}
    steps:
      # Git for Windows turns line endings into CRLF by default, and the lockstep patch only applies
      # to files that end their lines with LF. Before the first checkout, so that all of them agree.
      - name: Keep the line endings of the repositories, and allow long paths
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled -PropertyType DWord -Value 1 -Force | Out-Null

      - uses: actions/checkout@v4

      # The MSVC environment first: pip builds Capstone from source here (it has no wheel for
      # Windows on ARM), and ModernGekko builds with the same compiler.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Install the Python dependencies
        run: |
          python -c "import platform, sys; print('Python', sys.version.split()[0], 'on', platform.machine())"
          python -m pip install -r requirements.txt
          python -c "import capstone; print('Capstone', capstone.__version__)"

      - name: Download ModernGekko-Template at the commit the project is pinned to
        run: |
          # The same commit as scripts/build_and_run_linux.sh, so every platform builds the same code.
          template_commit=$(sed -n 's/^readonly TEMPLATE_COMMIT="\([0-9a-f]\{40\}\)"$/\1/p' scripts/build_and_run_linux.sh)
          [[ -n "$template_commit" ]] || { echo "TEMPLATE_COMMIT not found in the Linux script" >&2; exit 1; }
          echo "ModernGekko-Template commit: $template_commit"
          git clone --no-checkout "$TEMPLATE_URL" "$TEMPLATE_DIRECTORY"
          git -C "$TEMPLATE_DIRECTORY" checkout --quiet "$template_commit"
          git -C "$TEMPLATE_DIRECTORY" submodule sync --recursive --quiet
          # Qt is not used (ModernGekko turns it off) and libadrenotools is for Android.
          # HTTP/1.1 because HTTP/2 often cuts big fetches ("curl 92").
          for attempt in 1 2 3; do
            git -C "$TEMPLATE_DIRECTORY" -c http.version=HTTP/1.1 \
              -c submodule.Externals/Qt.update=none \
              -c submodule.Externals/libadrenotools.update=none \
              submodule update --init --recursive --force --depth 1 --jobs 4 && break
            echo "download attempt $attempt failed" >&2
            [[ "$attempt" -lt 3 ]] || exit 1
          done

      # The second patch only matters to the module built with the portable compiler (below), and
      # changes nothing for MSVC.
      - name: Apply the lockstep verifier patches
        run: |
          git -C "$TEMPLATE_DIRECTORY/lib/ModernGekko/vendor/dolphin" apply \
            "$GITHUB_WORKSPACE/patches/moderngekko/lockstep-verifier.patch" \
            "$GITHUB_WORKSPACE/patches/moderngekko/export-lockstep-hook-on-mingw.patch"

      - name: Look at the build tools
        run: |
          for tool in cmake ninja python cl; do echo "$tool: $(command -v "$tool")"; done
          cmake --version | head -n 1
          cl 2>&1 | head -n 1

      - name: Configure ModernGekko
        run: |
          cmake -S "$TEMPLATE_DIRECTORY/lib/ModernGekko" -B "$TEMPLATE_DIRECTORY/lib/ModernGekko/build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DDOLRECOMP_ENABLE_LLVM=OFF

      - name: Build moderngekko-port, moderngekko-run and dolrecomp
        run: cmake --build "$TEMPLATE_DIRECTORY/lib/ModernGekko/build" --target moderngekko-port

      # --headless: the runner opens no window, so it does not matter whether this machine has a
      # desktop session.
      - name: Run the instruction-level test
        run: |
          read -ra seeds <<< "$SEEDS"
          python tools/run_isa_conformance.py --synthetic --headless \
            --template "$TEMPLATE_DIRECTORY" \
            --work-directory "$WORK_DIRECTORY" \
            --toolchain msvc \
            --seeds "${seeds[@]}" \
            --words-per-form "$WORDS_PER_FORM"

      # The player's laptop will not have Visual Studio: the module of the game is compiled there
      # from the player's own disc, so the project ships a portable compiler (llvm-mingw, which has
      # a build that runs on Windows ARM64) and the same test has to pass with it.
      - name: Download the portable compiler (llvm-mingw)
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_MINGW_RELEASE: "20261020"
        run: |
          New-Item -ItemType Directory -Force C:\compiler | Out-Null
          Set-Location C:\compiler
          gh release download $env:LLVM_MINGW_RELEASE --repo mstorsjo/llvm-mingw --pattern '*-ucrt-aarch64.zip'
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Could not download llvm-mingw $env:LLVM_MINGW_RELEASE. The latest releases are:"
            gh release list --repo mstorsjo/llvm-mingw --limit 5
            exit 1
          }
          Get-FileHash -Algorithm SHA256 *.zip | Format-List Hash, Path
          Expand-Archive -Path (Get-Item *.zip).FullName -DestinationPath C:\compiler -Force
          $clang = Join-Path (Get-ChildItem C:\compiler -Directory -Filter 'llvm-mingw-*').FullName 'bin\clang.exe'
          & $clang --version

      # A PATH with the portable compiler, CMake, Ninja and Python only, and none of the variables
      # of the Visual Studio environment, so that nothing can fall back to MSVC.
      - name: Run the instruction-level test with the portable compiler
        if: always()
        shell: pwsh
        run: |
          $compiler = Join-Path (Get-ChildItem C:\compiler -Directory -Filter 'llvm-mingw-*').FullName 'bin'
          $python = Split-Path (Get-Command python).Source
          $env:PATH = "$compiler;C:\Program Files\CMake\bin;C:\Tools\Ninja;$python;C:\Windows\System32;C:\Windows"
          Remove-Item Env:INCLUDE, Env:LIB, Env:LIBPATH -ErrorAction SilentlyContinue
          clang --version | Select-Object -First 1
          $seeds = $env:SEEDS -split ' '
          python tools/run_isa_conformance.py --synthetic --headless `
            --template $env:TEMPLATE_DIRECTORY `
            --work-directory $env:PORTABLE_WORK_DIRECTORY `
            --toolchain clang `
            --seeds $seeds `
            --words-per-form $env:WORDS_PER_FORM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The reports are also kept as artifacts, but the logs of a failure are worth reading at once.
      - name: Show the end of the logs if the test failed
        if: failure()
        run: |
          for log in "$WORK_DIRECTORY"/seed_*/module.log "$WORK_DIRECTORY"/seed_*/run/game.log \
                     "$PORTABLE_WORK_DIRECTORY"/seed_*/module.log "$PORTABLE_WORK_DIRECTORY"/seed_*/run/game.log; do
            [[ -f "$log" ]] || continue
            echo "::group::$log"
            tail -n 150 "$log"
            echo "::endgroup::"
          done

      # The upload step cannot take files from two folders that are outside the workspace, so the
      # reports of the two passes are copied into one folder, each pass in its own subfolder.
      - name: Gather the reports in one folder
        if: always()
        run: |
          gather() {
            local compiler="$1" work_directory="$2" report seed_directory
            for report in "$work_directory"/seed_*/report.txt "$work_directory"/seed_*/cases.tsv; do
              [ -f "$report" ] || continue
              seed_directory="$(basename "$(dirname "$report")")"
              mkdir -p "C:/reports/$compiler/$seed_directory"
              cp "$report" "C:/reports/$compiler/$seed_directory/"
            done
          }
          gather msvc "$WORK_DIRECTORY"
          gather clang "$PORTABLE_WORK_DIRECTORY"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-Windows-ARM64
          path: C:/reports
          if-no-files-found: warn
