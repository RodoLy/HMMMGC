name: Windows ARM64

# Builds ModernGekko and DolRecomp, the tools that turn the game's executable
# into a program for Windows on ARM (Snapdragon laptops), on a native ARM64
# runner. No game data is involved: the game is recompiled later, on the
# player's computer, from their own disc.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-arm64.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: ModernGekko and DolRecomp
    runs-on: windows-11-arm
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      TEMPLATE_URL: https://github.com/ExpansionPak/ModernGekko-Template.git
      TEMPLATE_DIRECTORY: ${{ github.workspace }}/ModernGekko-Template
    steps:
      - uses: actions/checkout@v4

      - name: Download ModernGekko-Template at the commit the project is pinned to
        run: |
          # The same commit as scripts/build_and_run_linux.sh, so both platforms build the same code.
          template_commit=$(sed -n 's/^readonly TEMPLATE_COMMIT="\([0-9a-f]\{40\}\)"$/\1/p' scripts/build_and_run_linux.sh)
          [[ -n "$template_commit" ]] || { echo "TEMPLATE_COMMIT not found in the Linux script" >&2; exit 1; }
          echo "ModernGekko-Template commit: $template_commit"
          git clone --no-checkout "$TEMPLATE_URL" "$TEMPLATE_DIRECTORY"
          git -C "$TEMPLATE_DIRECTORY" checkout --quiet "$template_commit"
          git -C "$TEMPLATE_DIRECTORY" submodule sync --recursive --quiet
          # Qt is not used (ModernGekko turns it off) and libadrenotools is for Android.
          # HTTP/1.1 because HTTP/2 often cuts big fetches ("curl 92").
          for attempt in 1 2 3; do
            git -C "$TEMPLATE_DIRECTORY" -c http.version=HTTP/1.1 \
              -c submodule.Externals/Qt.update=none \
              -c submodule.Externals/libadrenotools.update=none \
              submodule update --init --recursive --force --depth 1 --jobs 4 && break
            echo "download attempt $attempt failed" >&2
            [[ "$attempt" -lt 3 ]] || exit 1
          done

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Look at the runner
        run: |
          echo "processor: $PROCESSOR_ARCHITECTURE"
          for tool in cmake ninja git python cl link; do
            if command -v "$tool" > /dev/null; then echo "$tool: $(command -v "$tool")"; else echo "$tool: missing"; fi
          done
          cmake --version | head -n 1
          cl 2>&1 | head -n 1

      - name: Make sure Ninja is available
        run: |
          command -v ninja > /dev/null || python -m pip install ninja
          ninja --version

      - name: Configure
        run: |
          cmake -S "$TEMPLATE_DIRECTORY/lib/ModernGekko" -B "$TEMPLATE_DIRECTORY/lib/ModernGekko/build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DDOLRECOMP_ENABLE_LLVM=OFF

      - name: Build moderngekko-port, moderngekko-run and dolrecomp
        run: cmake --build "$TEMPLATE_DIRECTORY/lib/ModernGekko/build" --target moderngekko-port

      - name: List what was built
        run: |
          cd "$TEMPLATE_DIRECTORY/lib/ModernGekko/build"
          find . -maxdepth 2 \( -name '*.exe' -o -name '*.dll' \) -printf '%p  %s bytes\n' | sort
          ls

      - name: Check that the programs start and are ARM64
        run: |
          cd "$TEMPLATE_DIRECTORY/lib/ModernGekko/build"
          for program in moderngekko-port moderngekko-run dolrecomp; do
            echo "== $program"
            dumpbin //headers "$program.exe" | grep -i "machine"
            "./$program.exe" --help 2>&1 | head -n 5 || true
          done
