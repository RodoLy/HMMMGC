name: Tests

# Lint and unit tests of the Python tools, a shellcheck of the shell scripts and a
# check of the PowerShell scripts of the Windows package. None of it needs the game:
# the tests that read the game's executable are skipped when HM_MM_DOL is not set.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, python-version: "3.11" }
          - { runner: ubuntu-24.04, python-version: "3.12" }
          - { runner: ubuntu-24.04, python-version: "3.13" }
          # The ARM64 processor the project is meant to run on.
          - { runner: ubuntu-24.04-arm, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install the dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: python -m pytest -q

  shell-scripts:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck scripts/*.sh

  powershell-scripts:
    name: PowerShell scripts
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # The parser of PowerShell finds syntax errors without running the script, which could
      # only be done on Windows ARM64 (see package-windows-arm64.yml).
      - name: Parse the scripts
        run: |
          $files = Get-ChildItem packaging/windows/* -Include *.ps1, *.psd1
          $problems = 0
          foreach ($file in $files) {
              $parseErrors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref] $null, [ref] $parseErrors)
              foreach ($parseError in $parseErrors) {
                  Write-Host "::error file=$($file.FullName),line=$($parseError.Extent.StartLineNumber)::$($parseError.Message)"
                  $problems++
              }
              Write-Host "$($file.Name): $($parseErrors.Count) syntax errors"
          }
          if ($problems -gt 0) { exit 1 }

      - name: Read the game's data
        run: |
          $game = Import-PowerShellDataFile packaging/windows/game.psd1
          $game.GetEnumerator() | Sort-Object Name | Format-Table -AutoSize
          foreach ($key in 'GameId', 'GameName', 'LauncherName', 'UserDirectoryName', 'DiscExtensions') {
              if (-not $game.ContainsKey($key)) { throw "game.psd1 has no $key" }
          }

      # The package assembler adds the byte-order mark that Windows PowerShell 5.1 needs for the
      # accented letters, so the rule that asks for it in the repository's files is left out.
      - name: PSScriptAnalyzer
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $findings = Invoke-ScriptAnalyzer -Path packaging/windows -Recurse -ExcludeRule PSUseBOMForUnicodeEncodedFile
          $findings | Format-Table -AutoSize -Wrap RuleName, Severity, ScriptName, Line, Message
          Write-Host "$($findings.Count) findings"
          if ($findings.Count -gt 0) { exit 1 }
